name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python scripts/audit_public_tree.py .
      - run: python scripts/check_seed_skills_parity.py
      - run: python scripts/validate_workspace.py examples/starter-workspace
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        shell: bash
      - run: skillferry --version
      - run: test "$(skillferry --version)" = "0.1.0"
        shell: bash
